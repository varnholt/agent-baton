name: release

# Push a tag like v0.1.0 to publish to PyPI.
# Uses PyPI trusted publishing: no token is stored in this repo.

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --group dev pytest -q
      - name: check tag matches version
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
