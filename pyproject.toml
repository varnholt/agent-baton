[project]
name = "agent-baton"
version = "0.1.0"
description = "Pass verified facts between coding agents, so none of them sits waiting on a human relay."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
baton = "agent_baton.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_baton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
